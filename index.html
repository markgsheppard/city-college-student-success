<p style="margin: 0; font-size: 16px; color: #3D4752">CUNY's doctoral program in economics is based at the Graduate Center (365 Fifth Avenue, Manhattan). City College faculty, including Professor De, are on its doctoral faculty. It's a full-time research degree that trains economists for academia, government and policy research.</p>

<li style="background: #F2F4F7; padding: 18px; border-top: 4px solid #5F259F; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 13px; letter-spacing: 1px; color: #5F259F">LEVEL I · YEARS 1–2</strong><strong style="font-size: 17px">Coursework &amp; First Exam</strong><span style="font-size: 14px; color: #3D4752">Core theory and econometrics courses, then the First Examination. You must pass it to continue past 45 credits, and the program expects it passed by June of year two.</span></li>
<li style="background: #F2F4F7; padding: 18px; border-top: 4px solid #5F259F; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 13px; letter-spacing: 1px; color: #5F259F">LEVEL II · YEARS 2–3</strong><strong style="font-size: 17px">Fields &amp; Second Exam</strong><span style="font-size: 14px; color: #3D4752">Complete field courses, then pass the Second Examination (a field exam, usually in August) within 10 registered semesters.</span></li>
<li style="background: #F2F4F7; padding: 18px; border-top: 4px solid #5F259F; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 13px; letter-spacing: 1px; color: #5F259F">LEVEL III · CANDIDACY</strong><strong style="font-size: 17px">Advance to candidacy</strong><span style="font-size: 14px; color: #3D4752">All coursework done (at least 30 credits at CUNY) with a B average, plus both exams.</span></li>
<li style="background: #F2F4F7; padding: 18px; border-top: 4px solid #C9B6E8; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 13px; letter-spacing: 1px; color: #2E1052">DISSERTATION</strong><strong style="font-size: 17px">Research &amp; defense</strong><span style="font-size: 14px; color: #3D4752">Original research, a committee of at least three CUNY doctoral faculty, and an oral defense. Everything must be finished within eight years of matriculating.</span></li>
</ol>

<section id="publish" style="max-width: 1240px; margin: 0 auto; padding: 64px 24px">
<p style="margin: 0 0 6px; font-size: 14px; font-weight: 700; letter-spacing: 1.6px; color: #5F259F">05 · PUBLISH &amp; PRESENT</p>
<h2 style="margin: 0 0 12px; font-family: 'Nunito Sans', 'Open Sans', Arial, sans-serif; font-size: 38px; line-height: 1.15">Turn your paper into a publication</h2>
<p style="margin: 0 0 32px; max-width: 760px; color: #3D4752">A strong class assignment or senior project can become a conference paper or journal submission. Here's how, and where to send it.</p>

<h3 style="margin: 0 0 16px; font-size: 20px">From class paper to submission</h3>
<ol style="margin: 0 0 40px; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<li style="border-left: 0; background: #F2F4F7; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Nunito Sans', 'Open Sans', Arial, sans-serif; font-size: 34px; font-weight: 700; color: #5F259F; line-height: 1">1</span><strong>Find a faculty mentor</strong><span style="font-size: 15px; color: #3D4752">Ask your instructor whether the paper has a publishable question.</span></li>
<li style="background: #F2F4F7; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Nunito Sans', 'Open Sans', Arial, sans-serif; font-size: 34px; font-weight: 700; color: #5F259F; line-height: 1">2</span><strong>Strengthen the analysis</strong><span style="font-size: 15px; color: #3D4752">Add a literature review, better data and robustness checks.</span></li>
<li style="background: #F2F4F7; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Nunito Sans', 'Open Sans', Arial, sans-serif; font-size: 34px; font-weight: 700; color: #5F259F; line-height: 1">3</span><strong>Present it first</strong><span style="font-size: 15px; color: #3D4752">Get feedback at the research seminar or a student conference.</span></li>
<li style="background: #F2F4F7; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Nunito Sans', 'Open Sans', Arial, sans-serif; font-size: 34px; font-weight: 700; color: #5F259F; line-height: 1">4</span><strong>Submit</strong><span style="font-size: 15px; color: #3D4752">Format to the venue's guidelines and send it with your mentor's support.</span></li>
</ol>

<h3 style="margin: 0 0 6px; font-size: 20px">Where to submit</h3>
<p style="margin: 0 0 16px; font-size: 15px; color: #525D69">Start at your own college, then look outward. Deadlines shown are the usual timing; confirm the current call for papers before you submit.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px">
<div style="border: 1px solid #DCE1E7; border-top: 5px solid #C9B6E8; padding: 22px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #525D69">COLIN POWELL SCHOOL</span>
<strong style="font-size: 18px">Fellowship research and capstone projects</strong>
<span style="font-size: 15px; color: #3D4752">Colin Powell School fellowships end in a project or policy paper. Ask the Office of Student Success how fellows present and publish their work.</span>
<a href="https://cps-oss.ccny.cuny.edu/?p=159" target="_blank" rel="noopener" style="margin-top: auto; font-weight: 600; font-size: 15px">Fellowship programs ↗</a>
</div>
<div style="border: 1px solid #DCE1E7; border-top: 5px solid #C9B6E8; padding: 22px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #525D69">CITY COLLEGE ECONOMICS</span>
<strong style="font-size: 18px">Bloomberg Lab</strong>
<span style="font-size: 15px; color: #3D4752">The department's Bloomberg terminals give students the market data behind an empirical paper.</span>
<a href="https://colinpowellschool.ccny.cuny.edu/economics-and-business/bloomberg-lab/" target="_blank" rel="noopener" style="margin-top: auto; font-weight: 600; font-size: 15px">About the lab ↗</a>
</div>
